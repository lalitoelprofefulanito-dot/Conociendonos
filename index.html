<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4667">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conociéndonos">
<meta name="mobile-web-app-capable" content="yes">

<title>Conociéndonos 2.0 — Prototipo navegable (Iteración 3 — Presencia y Ternura)</title>
<style>
:root{
  --azul:#2C5F8A; --azul-suave:#EAF1F7; --azul-oscuro:#1F4667;
  --verde:#4B8B6F; --verde-suave:#E9F3EE;
  --ambar:#B8862C; --ambar-suave:#FBF1DE;
  --rojo:#A6543F; --rojo-suave:#F7EAE6;
  --ternura:#7D5A6B; --ternura-suave:#F4ECF0;
  --gris-900:#2A2E33; --gris-700:#565C64; --gris-500:#7C838C; --gris-300:#C7CCD1; --gris-100:#EEF0F2;
  --superficie-consulta:#F4F4F2;
  --fondo:#FAFAF8; --tarjeta:#FFFFFF;

  --borde-radius:10px;
  --sombra:0 1px 2px rgba(30,30,30,.06), 0 1px 8px rgba(30,30,30,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--fondo); color:var(--gris-900); line-height:1.5;
  font-size:15px;
}
h1,h2,h3,h4{font-weight:600; margin:0 0 8px 0; line-height:1.25;}
h1{font-size:22px;}
h2{font-size:17px;}
h3{font-size:15px;}
p{margin:0 0 10px 0;}
a{color:var(--azul); text-decoration:none;}
.small{font-size:12.5px; color:var(--gris-500);}
.muted{color:var(--gris-500);}
button{font-family:inherit; font-size:14px; cursor:pointer;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:3px solid var(--azul-oscuro); outline-offset:2px;
}

/* ---------- layout shell ---------- */
#proto-banner{
  background:var(--gris-900); color:#fff; text-align:center; font-size:12.5px;
  padding:5px 8px calc(5px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px));
  padding-right:calc(8px + env(safe-area-inset-right, 0px));
  letter-spacing:.02em;
}
#app-shell{display:flex; min-height:calc(100vh - 28px); min-height:calc(100dvh - 28px);}
#sidebar{
  width:210px; background:var(--tarjeta); border-right:1px solid var(--gris-100);
  display:flex; flex-direction:column; padding:14px 10px; flex-shrink:0;
  padding-left:calc(10px + env(safe-area-inset-left, 0px));
}
#sidebar .brand{font-weight:700; font-size:16px; color:var(--azul-oscuro); padding:6px 10px 16px;}
.navlink{
  display:flex; align-items:center; gap:8px; padding:11px 10px; border-radius:8px; color:var(--gris-700);
  font-size:14px; margin-bottom:2px; cursor:pointer; border:none; background:none; text-align:left; width:100%;
  min-height:44px;
}
.navlink:hover{background:var(--gris-100);}
.navlink.active{background:var(--azul-suave); color:var(--azul-oscuro); font-weight:600;}
.navlink .ic{width:18px; text-align:center;}
.navlink[disabled]{opacity:.4; cursor:not-allowed;}
#sidebar .navgroup-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gris-500); margin:14px 10px 4px;}

#main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  background:var(--tarjeta); border-bottom:1px solid var(--gris-100); padding:10px 20px;
  padding-right:calc(20px + env(safe-area-inset-right, 0px));
  display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:0; z-index:20;
  flex-wrap:wrap;
}
#topbar .ctx{font-size:13px; color:var(--gris-700);}
#topbar .ctx b{color:var(--gris-900);}
#topbar-right{display:flex; align-items:center; gap:14px;}
.iconbtn{background:none; border:none; font-size:18px; position:relative; padding:10px; border-radius:6px; color:var(--gris-700); min-width:44px; min-height:44px;}
.iconbtn:hover{background:var(--gris-100);}
.badge-count{
  position:absolute; top:-2px; right:-2px; background:var(--rojo); color:#fff; font-size:10px;
  border-radius:8px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px;
}
#account-chip{display:flex; align-items:center; gap:6px; background:var(--gris-100); border:none; border-radius:20px; padding:8px 12px 8px 6px; min-height:44px;}
.avatar{width:24px; height:24px; border-radius:50%; background:var(--azul); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}

#content{padding:22px 26px 60px; max-width:980px; padding-right:calc(26px + env(safe-area-inset-right, 0px)); padding-left:calc(26px + 0px);}
.breadcrumb{font-size:12.5px; color:var(--gris-500); margin-bottom:10px;}
.breadcrumb a{color:var(--gris-500);}
.breadcrumb .cur{color:var(--gris-900); font-weight:600;}

/* ---------- cards & chips ---------- */
.card{
  background:var(--tarjeta); border:1px solid var(--gris-100); border-radius:var(--borde-radius);
  box-shadow:var(--sombra); padding:16px 18px; margin-bottom:14px;
}
.card.consulta{background:var(--superficie-consulta); border-color:var(--gris-100);}
.card.clickable{cursor:pointer;}
.card.clickable:hover{border-color:var(--azul);}
.card.dim{opacity:.72;}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
  padding:3px 10px; border-radius:20px; letter-spacing:.01em;
}
.chip-activo{background:var(--verde-suave); color:var(--verde);}
.chip-pendiente{background:var(--ambar-suave); color:var(--ambar);}
.chip-cerrado{background:var(--gris-100); color:var(--gris-700);}
.chip-vencida, .chip-revocada{background:var(--rojo-suave); color:var(--rojo);}
.chip-familia{background:#EFE9F7; color:#6A4E97;}
.chip-escuela{background:#E4F0F5; color:#2C6E8A;}

.chip-aprendizaje-propuesto{background:#E7EAF2; color:#4C5B85;}
.chip-aprendizaje-construccion{background:var(--azul-suave); color:var(--azul);}
.chip-aprendizaje-sustentado{background:var(--verde-suave); color:var(--verde);}
.chip-aprendizaje-revision{background:var(--ambar-suave); color:var(--ambar);}
.chip-aprendizaje-cerrado{background:var(--gris-100); color:var(--gris-700);}

.chip-estr-explorar{background:var(--gris-100); color:var(--gris-700);}
.chip-estr-exploracion{background:var(--azul-suave); color:var(--azul);}
.chip-estr-resultados{background:var(--verde-suave); color:var(--verde);}
.chip-estr-ajustes{background:var(--ambar-suave); color:var(--ambar);}
.chip-estr-pausa{background:#F1EEE6; color:#8A7A4E;}
.chip-estr-cerrada{background:var(--gris-100); color:var(--gris-700);}

/* buttons */
.btn{border-radius:8px; padding:10px 16px; font-weight:600; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; min-height:44px; touch-action:manipulation;}
.btn-primary{background:var(--azul); color:#fff;}
.btn-primary:hover{background:var(--azul-oscuro);}
.btn-secondary{background:#fff; border-color:var(--gris-300); color:var(--gris-900);}
.btn-secondary:hover{border-color:var(--azul);}
.btn-text{background:none; border:none; color:var(--azul); padding:10px 6px; font-weight:600; min-height:40px;}
.btn-danger{background:#fff; border-color:var(--rojo); color:var(--rojo);}
.btn-danger:hover{background:var(--rojo-suave);}
.btn-sm{padding:8px 12px; font-size:13px; min-height:38px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:5px;}
.field .req{color:var(--rojo);}
.field .help{font-size:12px; color:var(--gris-500); margin-top:4px;}
.field input[type=text], .field input[type=date], .field textarea, .field select{
  width:100%; padding:11px 12px; border:1px solid var(--gris-300); border-radius:8px; font-size:16px; font-family:inherit;
  -webkit-appearance:none; appearance:none;
}
.field textarea{min-height:70px; resize:vertical;}
.field.err input, .field.err textarea{border-color:var(--rojo);}
.field .errtext{color:var(--rojo); font-size:12.5px; margin-top:4px; display:none;}
.field.err .errtext{display:block;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}

/* tabs */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--gris-100); margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--gris-500); border:none; background:none; border-bottom:2px solid transparent; cursor:pointer;}
.tab.active{color:var(--azul); border-bottom-color:var(--azul);}
.tab:hover{color:var(--azul-oscuro);}

/* vigencia bar */
.vigencia{margin:6px 0;}
.vigencia .bar{height:6px; background:var(--gris-100); border-radius:4px; overflow:hidden; margin-bottom:4px;}
.vigencia .bar-fill{height:100%; border-radius:4px;}
.vigencia.ok .bar-fill{background:var(--verde);}
.vigencia.pronto .bar-fill{background:var(--ambar);}
.vigencia.vencida .bar-fill{background:var(--rojo);}
.vigencia-text{font-size:12.5px; font-weight:600;}
.vigencia.ok .vigencia-text{color:var(--verde);}
.vigencia.pronto .vigencia-text{color:var(--ambar);}
.vigencia.vencida .vigencia-text{color:var(--rojo);}

/* banners */
.banner{border-radius:8px; padding:10px 14px; font-size:13.5px; margin-bottom:14px; display:flex; gap:10px; align-items:flex-start;}
.banner-info{background:var(--azul-suave); color:var(--azul-oscuro);}
.banner-warn{background:var(--ambar-suave); color:#7A5A1B;}
.banner-neutral{background:var(--gris-100); color:var(--gris-700);}
.nota-ternura{
  background:var(--ternura-suave); color:var(--ternura); border-radius:8px; padding:9px 12px;
  font-size:13px; font-style:italic; margin:6px 0 14px; display:flex; gap:10px; align-items:flex-start;
  border-left:3px solid var(--ternura);
}
.nota-ternura .txt{flex:1;}
.nota-ternura .cerrar{
  background:none; border:none; color:var(--ternura); font-style:normal; font-weight:700;
  cursor:pointer; padding:8px; line-height:1; opacity:.6; min-width:32px; min-height:32px;
}
.nota-ternura .cerrar:hover{opacity:1;}

/* toasts */
#toast-region{position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{background:var(--verde-suave); color:#2E6349; border-radius:8px; padding:10px 14px; font-size:13.5px; box-shadow:var(--sombra); border:1px solid #cfe6da;}

/* modal */
#modal-overlay{position:fixed; inset:0; background:rgba(30,32,34,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));}
#modal-overlay.open{display:flex;}
.modal{background:#fff; border-radius:12px; max-width:480px; width:100%; padding:22px 24px; box-shadow:0 10px 40px rgba(0,0,0,.2); max-height:85vh; max-height:85dvh; overflow:auto; -webkit-overflow-scrolling:touch;}
.modal h2{margin-bottom:4px;}
.modal .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
.modal .warn-box{background:var(--ambar-suave); color:#7A5A1B; border-radius:8px; padding:10px 12px; font-size:13px; margin:12px 0;}

/* misc */
.divider{border:none; border-top:1px solid var(--gris-100); margin:14px 0;}
.trace-panel{background:var(--superficie-consulta); border-radius:8px; padding:10px 12px; font-size:12px; color:var(--gris-700); max-height:150px; overflow:auto;}
.trace-panel .ln{padding:2px 0; border-bottom:1px dashed var(--gris-300);}
.trace-panel .ln:last-child{border:none;}
.empty-state{text-align:center; padding:40px 20px; color:var(--gris-500);}
.dl{display:grid; grid-template-columns:140px 1fr; gap:6px 14px; font-size:13.5px;}
.dl dt{color:var(--gris-500); font-weight:600;}
.dl dd{margin:0;}
.section-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gris-500); margin:18px 0 8px;}

/* responsive */
html, body{overflow-x:hidden; max-width:100%;}
#content, .card, .modal, table{max-width:100%;}
table{display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;}

@media (max-width:760px){
  #app-shell{flex-direction:column;}
  #sidebar{
    width:100%; flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch; border-right:none; border-bottom:1px solid var(--gris-100);
    padding:8px; padding-left:calc(8px + env(safe-area-inset-left, 0px)); padding-right:calc(8px + env(safe-area-inset-right, 0px)); gap:2px;
  }
  #sidebar .brand{display:none;}
  #sidebar .navgroup-label{display:none;}
  .navlink{white-space:nowrap; padding:11px 12px;}
  #topbar{padding:8px 14px; padding-right:calc(14px + env(safe-area-inset-right, 0px));}
  #topbar .ctx{font-size:12px; line-height:1.5;}
  #content{padding:16px; padding-right:calc(16px + env(safe-area-inset-right, 0px)); padding-bottom:calc(60px + env(safe-area-inset-bottom, 0px));}
  .field-row{flex-direction:column; gap:0;}
  .modal{max-width:100%; width:100%; max-height:92dvh; max-height:92vh; border-radius:16px 16px 0 0; margin-top:auto;}
  #modal-overlay{padding:0; align-items:flex-end;}
  .dl{grid-template-columns:1fr;}
  .dl dt{margin-top:8px;}
  h1{font-size:20px;}
}
@media (max-width:420px){
  .btn{padding:10px 12px; font-size:13.5px;}
  .card{padding:13px 14px;}
}
@media (orientation:landscape) and (max-height:480px){
  .modal{max-height:96dvh; max-height:96vh;}
}
</style>
</head>

function esVigente(a){
  if(a.estado!=="vigente") return false;
  return vigenciaInfo(a).cls !== "vencida";
}
function autorizacionVigentePara(actorId, objeto){
  const actor = actorInfo(actorId);
  if(actor.id==="fam") return true; // Administrador familiar: dueño de sus propios Procesos
  return DATA.autorizaciones.some(a => esVigente(a) && a.receptor.includes(actor.correo) && a.objeto===objeto);
}
function autorizacionRelevantePara(actorId, objeto){
  // para explicar el motivo de un acceso denegado: busca cualquier Autorización (vigente o no) de este actor sobre este objeto
  const actor = actorInfo(actorId);
  return DATA.autorizaciones.filter(a=>a.receptor.includes(actor.correo) && a.objeto===objeto).sort((x,y)=> (x.inicio<y.inicio?1:-1))[0] || null;
}

// ============================================================
// Regla aprobada: "Si el actor no tiene relación autorizada con la Conexión,
// la Conexión no existe para ese actor." Se expresa reutilizando el MISMO
// motor de permisos ya verificado para Procesos (autorizacionVigentePara) —
// una Conexión es visible/operable para un actor si, y solo si, ese actor
// tiene una Autorización vigente sobre el Proceso al que esa Conexión
// pertenece. Nunca "if(actor.id==='fam')" como regla artificial.
function actorPuedeVerConexion(actorId, conexion){
  if(!conexion || !conexion.procesoId) return false;
  return autorizacionVigentePara(actorId, "Proceso "+conexion.procesoId);
}
function conexionesVisiblesPara(actorId){
  return DATA.conexiones.filter(c=>actorPuedeVerConexion(actorId, c));
}

function pushTrace(msg, cat){
  STATE.trace.unshift({t:nowStamp(), msg, cat:cat||"general"});

function goTo(screen, params){
  params = params || {};

// ---------- nota de presencia / ternura ----------
// Principio de diseño (no decoración): un recordatorio breve, opcional y descartable,
// que invita a mirar la situación, el contexto y a la persona antes de registrar sobre ella.
// Reglas que esta función garantiza por construcción:
//  - No genera ningún dato ni se guarda en ningún lado (no toca STATE ni DATA).
//  - No se registra en trazabilidad (nunca llama a pushTrace).
//  - No aparece en exportaciones (no forma parte de ningún objeto exportable).
//  - Es descartable con un solo toque, sin bloquear ninguna acción.
function notaTernura(texto){
  return `<div class="nota-ternura"><span class="txt">${texto}</span><button class="cerrar" type="button" aria-label="Ocultar este recordatorio" onclick="this.closest('.nota-ternura').remove()">×</button></div>`;
}

// ---------- modal ----------
function openModal(html, onOpen){
  const overlay = document.getElementById("modal-overlay");
  overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  overlay.classList.add("open");
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  document.addEventListener("keydown", modalEscHandler);
  // H2 (Fase 8.1): el foco inicial debe caer en el primer campo REAL del formulario, no en el
  // botón de cerrar de una nota de presencia (.nota-ternura) que pueda anteceder a esos campos.
  // La nota y su botón de cierre se conservan exactamente igual, y siguen siendo alcanzables
  // con Tab/Shift+Tab como cualquier otro control del modal — solo dejan de ser el foco inicial.
  const candidatos = overlay.querySelectorAll("button, input, textarea, select");
  const focusable = Array.from(candidatos).find(el => !el.closest(".nota-ternura"));
  if(focusable) focusable.focus();
  if(onOpen) onOpen();
}
function modalEscHandler(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){
  document.getElementById("modal-overlay").classList.remove("open");
  document.getElementById("modal-overlay").innerHTML="";
  document.removeEventListener("keydown", modalEscHandler);
}
function confirmModal(opts){
  // opts: {title, body, warn, confirmLabel, danger, onConfirm}
  openModal(`
    <h2>${opts.title}</h2>
    <p class="muted">${opts.body}</p>
    ${opts.warn?`<div class="warn-box">${opts.warn}</div>`:""}
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn ${opts.danger?'btn-danger':'btn-primary'}" id="modal-confirm-btn">${opts.confirmLabel||"Confirmar"}</button>
    </div>
  `, ()=>{
    document.getElementById("modal-confirm-btn").onclick = ()=>{ closeModal(); opts.onConfirm(); };
    document.getElementById("modal-confirm-btn").blur();
    document.querySelector(".modal .btn-secondary").focus();
  });
}

  // "cambiar actor". Ahora: si el actor actual sigue siendo válido para el nuevo espacio, se
  // CONSERVA; si no lo es, se reinicia — pero solo se avisa de forma visible cuando existía una
  // elección manual previa que se está sustituyendo (nunca un cambio de identidad silencioso).
  STATE.espacio = id;
  const actorActual = actorInfo(STATE.actor);
  const actorSigueValido = (id==="fam" && actorActual.tipo==="Familia") || (id==="esc" && actorActual.tipo==="Escuela");
  if(actorSigueValido){
    pushTrace(`Contexto de trabajo activo: ${id==='fam'?'Familia':'Escuela'}. Actor conservado: ${actorActual.nombre}.`);
  } else {
    const nombreAnterior = actorActual.nombre;
    const huboEleccionManual = STATE.actorElegidoManualmente;
    STATE.actor = id==="fam" ? "fam" : "docA";
    STATE.actorElegidoManualmente = false;
    if(huboEleccionManual){
      pushTrace(`Cambio de espacio: el actor elegido manualmente ("${nombreAnterior}") no pertenece al espacio ${id==='fam'?'Familia':'Escuela'}. Actor reiniciado a ${actorInfo(STATE.actor).nombre}.`, "acceso");
      toast(`"${nombreAnterior}" no pertenece a este espacio. Actor reiniciado a ${actorInfo(STATE.actor).nombre}.`);
    } else {
      pushTrace(`Contexto de trabajo activo: ${id==='fam'?'Familia':'Escuela'}. Actor: ${actorInfo(STATE.actor).nombre}.`);
    }
  }
  goTo("mis-procesos");
}

      <button class="btn btn-primary" onclick="guardarProceso()">Crear Proceso</button>
    </div>
  `);
}
function guardarProceso(){
  const campos = [["situacion","in-situacion"],["finalidad","in-finalidad"],["pregunta","in-pregunta"],["contexto","in-contexto"]];
  let ok = true;
  campos.forEach(([key, id])=>{
    const val = document.getElementById(id).value.trim();
    const field = document.getElementById("f-"+key);
    if(!val){ field.classList.add("err"); ok=false; } else { field.classList.remove("err"); }
  });
  if(!ok){ toast("Falta completar campos obligatorios."); return; }

  const finalidad = document.getElementById("in-finalidad").value.trim();
  const generalidad = finalidad.split(" ").length < 5;

  const id = "P" + (DATA.procesos.length + 1);
  const nuevo = {
    id, estado:"activo", espacio: STATE.espacio==="esc"?"Escuela":"Familia",
    situacion: document.getElementById("in-situacion").value.trim(),
    finalidad, pregunta: document.getElementById("in-pregunta").value.trim(),
    contexto: document.getElementById("in-contexto").value.trim(),
    creado: todayISO(), proximaRevision: document.getElementById("in-revision").value, ampliaciones:0,
    refPersona:"Proceso vinculado a una Relación (referencia ficticia)"
  };
  DATA.procesos.unshift(nuevo);
  DATA.observaciones[id] = []; DATA.estrategias[id] = []; DATA.aprendizajes[id] = []; DATA.acuerdos[id]=[];
  pushTrace(`Proceso ${id} creado en estado "activo".`);
  closeModal();
  toast("Proceso creado.");
  if(generalidad){
    setTimeout(()=>toast("Aviso: esta finalidad podría concretarse más. Puedes continuar así o precisarla."), 400);
  }
  goTo("proceso", {id, tab:"situacion"});
}

function screenDetalleProceso(){
  const p = currentProceso();
  if(!p) return `<div class="empty-state">Este Proceso ya no está disponible.</div>`;

  const actor = actorInfo(STATE.actor);
  if(!autorizacionVigentePara(actor.id, "Proceso "+p.id)){
    // El contenido del Proceso NUNCA se construye para un actor sin permiso vigente — no solo se oculta visualmente.
    const rel = autorizacionRelevantePara(actor.id, "Proceso "+p.id);
    let motivo = "Nunca has tenido una Autorización sobre este Proceso.";

    else if(rel && rel.estado==="vigencia_perdida") motivo = `Tu Autorización perdió vigencia (${rel.motivoPerdida}) el ${fmt(rel.fechaPerdida)}.`;
    else if(rel && vigenciaInfo(rel).cls==="vencida") motivo = `Tuviste una Autorización sobre este Proceso, pero venció el ${fmt(addDays(rel.inicio, rel.vigenciaDias))}.`;
    pushTrace(`Acceso denegado: ${actor.nombre} (${actor.rolLabel}) intentó abrir el Proceso ${p.id} sin Autorización vigente. ${motivo}`, "acceso");

      ${breadcrumb([{label:"Mis Procesos", screen:"mis-procesos"},{label:"Acceso denegado"}])}

        <p>${motivo}</p>
        <p class="small muted">El contenido de este Proceso no se muestra hasta comprobar una Autorización vigente — el permiso se comprueba al ejecutar la acción, no solo al mostrar el botón. Este intento quedó registrado.</p>
        <div class="btn-row">
          <button class="btn btn-secondary btn-sm" onclick="goTo('mis-procesos')">Volver a Mis Procesos</button>

  const tab = STATE.params.tab || "situacion";
  const tabs = [
    ["situacion","Situación"], ["observaciones","Observaciones"], ["curricular","Referente curricular"],
    ["estrategias","Estrategias"], ["aprendizajes","Aprendizajes"], ["acuerdos","Acuerdos"], ["visualizaciones","Visualizaciones"]
  ];

  let bodyHtml = "";
  if(tab==="situacion") bodyHtml = tabSituacion(p);
  else if(tab==="observaciones") bodyHtml = tabObservaciones(p);
  else if(tab==="curricular") bodyHtml = tabCurricular(p);
  else if(tab==="estrategias") bodyHtml = tabEstrategias(p);
  else if(tab==="aprendizajes") bodyHtml = tabAprendizajes(p);
  else if(tab==="acuerdos") bodyHtml = tabAcuerdos(p);
  else if(tab==="visualizaciones") bodyHtml = tabVisualizaciones(p);

  return `
    ${breadcrumb([{label:"Mis Procesos", screen:"mis-procesos"},{label:p.situacion.slice(0,40)+(p.situacion.length>40?"…":"")}])}
    <div class="card" style="margin-bottom:18px;">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
        <div>
          <h1>${p.situacion}</h1>
          <p class="small">${p.refPersona}</p>
        </div>
        <span class="chip ${p.estado==='activo'?'chip-activo':p.estado==='cerrado'?'chip-cerrado':'chip-pendiente'}">${p.estado==='activo'?'Activo':p.estado==='cerrado'?'Cerrado':'Revisión pendiente'}</span>
      </div>
      ${p.estado==='activo'&&p.proximaRevision?`<p class="small">Próxima revisión: ${fmt(p.proximaRevision)}</p>`:""}
      ${p.estado==='cerrado'?`<div class="banner banner-neutral">Este Proceso está cerrado. Se conserva como información histórica; no admite nuevos registros.</div>`:""}
      <div class="btn-row">
        ${p.estado==='activo'?`<button class="btn btn-secondary btn-sm" onclick="abrirAmpliarProceso('${p.id}')">Ampliar Proceso</button>`:""}
        ${p.estado==='activo'?`<button class="btn btn-secondary btn-sm" onclick="cerrarProceso('${p.id}')">Cerrar Proceso</button>`:""}
        <button class="btn btn-secondary btn-sm" onclick="abrirExportar('proceso','${p.id}')">Exportar</button>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(([k,label])=>`<button class="tab ${tab===k?'active':''}" onclick="goTo('proceso',{id:'${p.id}', tab:'${k}'})">${label}</button>`).join("")}

    ${bodyHtml}

}

function abrirAmpliarProceso(pid){
  openModal(`
    <h2>Ampliar este Proceso</h2>
    <p class="small muted">Se vincula una nueva Situación complementaria. La Situación fundacional no se modifica.</p>
    <div class="field"><label>Descripción <span class="req">*</span></label><textarea id="in-amp-desc"></textarea></div>
    <div class="field"><label>Fecha</label><input type="date" id="in-amp-fecha" value="${todayISO()}"></div>
    <div class="field"><label>Contexto <span class="req">*</span></label><textarea id="in-amp-ctx"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarAmpliacion('${pid}')">Vincular Situación</button>
    </div>
  `);
}
function guardarAmpliacion(pid){
  const desc = document.getElementById("in-amp-desc").value.trim();
  const ctx = document.getElementById("in-amp-ctx").value.trim();
  if(!desc || !ctx){ toast("La descripción y el contexto son obligatorios."); return; }
  DATA.situacionesAmpliacion[pid] = DATA.situacionesAmpliacion[pid] || [];
  DATA.situacionesAmpliacion[pid].push({fecha:document.getElementById("in-amp-fecha").value, descripcion:desc, contexto:ctx});
  const p = DATA.procesos.find(x=>x.id===pid); p.ampliaciones++;
  pushTrace(`Situación de ampliación vinculada al Proceso ${pid}.`);
  closeModal(); toast("Situación vinculada.");
  render();
}
function cerrarProceso(pid){
  confirmModal({
    title:"Cerrar este Proceso",
    body:"El Proceso pasará a estado \"cerrado\". El contenido no se elimina; queda conservado como información histórica.",
    confirmLabel:"Cerrar Proceso",
    onConfirm: ()=>{
      const p = DATA.procesos.find(x=>x.id===pid); p.estado="cerrado"; p.cerrado = todayISO(); p.proximaRevision=null;
      pushTrace(`Proceso ${pid} cerrado.`);
      toast("Proceso cerrado. El contenido se conserva como información histórica.");
      render();
    }
  });
}

// ---- Tab: Observaciones ----
function tabObservaciones(p){
  const obs = DATA.observaciones[p.id] || [];
  const grupos = {}; obs.forEach(o=>{ (grupos["Situación fundacional"]=grupos["Situación fundacional"]||[]).push(o); });
  const puedeRegistrar = p.estado==="activo";
  const historialAbierto = STATE.params.historialAbierto;
  return `
    <div class="btn-row" style="margin-bottom:12px;">
      ${puedeRegistrar
        ? `<button class="btn btn-primary btn-sm" onclick="abrirRegistrarObservacion('${p.id}')">Registrar Observación</button>`
        : `<span class="small muted">Este Proceso no admite nuevos registros (${p.estado}).</span>`}
    </div>
    ${Object.entries(grupos).map(([g,items])=>`
      <div class="section-label">${g}</div>
      ${items.map(o=>`
        <div class="card">
          <div style="display:flex; justify-content:space-between; gap:8px;">
            <span class="chip ${o.perspectiva==='Familia'?'chip-familia':'chip-escuela'}">${o.perspectiva}</span>
            <span class="small">${fmt(o.fecha)}</span>
          </div>
          <p style="margin-top:8px;">${o.descripcion}</p>
          ${o.voz ? `<div class="nota-ternura" style="margin-top:8px;"><span class="txt">Voz de la persona: "${o.voz}"</span></div>` : ""}
          <div class="btn-row">
            <button class="btn btn-text btn-sm" onclick="abrirCompartir('Observación','${o.id}')">Compartir</button>
            <button class="btn btn-text btn-sm" onclick="abrirCorregirObservacion('${p.id}','${o.id}')">Corregir</button>
            <button class="btn btn-text btn-sm" onclick="goTo('proceso',{id:'${p.id}', tab:'observaciones', historialAbierto:'${historialAbierto===o.id?'':o.id}'})">${historialAbierto===o.id?'Ocultar historial':'Ver historial'}</button>
          </div>
          ${historialAbierto===o.id ? panelHistorial(o.id) : ""}
        </div>`).join("")}
    `).join("") || `<div class="empty-state">Aún no hay Observaciones en este Proceso.</div>`}
  `;
}
function panelHistorial(entidadId){
  const hist = DATA_HISTORIAL[entidadId] || [];
  return `
    <div style="border-top:1px solid var(--gris-100); margin-top:10px; padding-top:10px;">
      <div class="section-label">Historial de esta entidad</div>
      ${hist.length===0 ? `<p class="small muted">Sin correcciones registradas. La versión actual es la original.</p>` : hist.map((v,i)=>`
        <div class="small" style="margin-bottom:8px; padding-bottom:8px; ${i<hist.length-1?'border-bottom:1px dashed var(--gris-300);':''}">
          <b>${fmt(v.fecha)}</b> — ${v.accion} — <span class="muted">${v.actor}</span>
          <p style="margin:4px 0;">${v.contenido}</p>
          ${i<hist.length-1 ? `<button class="btn btn-text btn-sm" onclick="recuperarVersion('${entidadId}', ${i})">Recuperar esta versión</button>` : `<span class="chip chip-activo">Versión vigente</span>`}
        </div>
      `).join("")}
    </div>
  `;
}
function abrirCorregirObservacion(pid, oid){
  const o = (DATA.observaciones[pid]||[]).find(x=>x.id===oid);
  openModal(`
    <h2>Corregir Observación</h2>
    <p class="small muted">La corrección queda registrada con trazabilidad; la versión anterior no se borra, queda disponible en el historial.</p>
    <div class="field"><label>Descripción corregida <span class="req">*</span></label><textarea id="in-corr-obs">${o.descripcion}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarCorreccion('${pid}','${oid}')">Guardar corrección</button>
    </div>
  `);
}
function guardarCorreccion(pid, oid){
  const nuevo = document.getElementById("in-corr-obs").value.trim();
  if(!nuevo){ toast("La descripción no puede quedar vacía."); return; }
  const o = (DATA.observaciones[pid]||[]).find(x=>x.id===oid);
  DATA_HISTORIAL[oid] = DATA_HISTORIAL[oid] || [{fecha:o.fecha, actor:"(registro original)", accion:"Registro original", contenido:o.descripcion}];
  o.descripcion = nuevo;
  DATA_HISTORIAL[oid].push({fecha:todayISO(), actor:actorInfo(STATE.actor).nombre, accion:"Corrección de error de captura", contenido:nuevo});
  pushTrace(`Observación ${oid} corregida. Versión anterior conservada en el historial (no se sobrescribió silenciosamente).`, "modificacion");
  closeModal(); toast("Observación corregida.");
  goTo("proceso", {id:pid, tab:"observaciones", historialAbierto:oid});
}
function recuperarVersion(entidadId, idx){
  const hist = DATA_HISTORIAL[entidadId];
  const version = hist[idx];
  // Recuperar NO sobrescribe silenciosamente: se agrega una nueva versión "recuperada", el historial anterior se conserva íntegro
  hist.push({fecha:todayISO(), actor:actorInfo(STATE.actor).nombre, accion:`Versión recuperada (de la del ${fmt(version.fecha)})`, contenido:version.contenido});
  for(const pid in DATA.observaciones){

function guardarAprendizaje(pid){
  const desc = document.getElementById("in-apr").value.trim();
  const ev = document.getElementById("in-apr-ev").value;
  let ok = true;
  if(!desc){ document.getElementById("f-apr").classList.add("err"); ok=false; } else document.getElementById("f-apr").classList.remove("err");
  if(!ev){ document.getElementById("f-apr-ev").classList.add("err"); ok=false; } else document.getElementById("f-apr-ev").classList.remove("err");

  const id = "L" + (Math.floor(Math.random()*9000)+1000);
  DATA.aprendizajes[pid] = DATA.aprendizajes[pid] || [];

  render();

function avanzarAprendizaje(id){
  const [a] = findAprendizaje(id); if(!a) return;
  const i = ORDEN_APR.indexOf(a.estado);
  if(a.evidencia.length===0){ toast("Este Aprendizaje necesita evidencia antes de avanzar de estado."); return; }
  a.estado = ORDEN_APR[Math.min(i+1, ORDEN_APR.length-2)]; // avanza sin saltar directo a "Cerrado" desde el botón de avance
  pushTrace(`Aprendizaje ${id} avanzó a "${a.estado}" (confirmación humana).`);
  toast("Estado actualizado.");
  render();
}
function cerrarAprendizaje(id){
  const [a] = findAprendizaje(id); if(!a) return;
  a.estado = "Cerrado";
  pushTrace(`Aprendizaje ${id} cerrado. No implica que haya sido falso.`);
  toast("Aprendizaje cerrado.");
  render();
}
function reconsiderarAprendizaje(pidOrigen, aprId){
  const [a] = findAprendizaje(aprId);

  DATA.aprendizajes[destino.id].unshift({id:nuevoId, descripcion:a.descripcion + " (reconsiderado)", estado:"Propuesto", evidencia:[], ia:false});
  pushTrace(`Aprendizaje reconsiderado como ${nuevoId} en Proceso ${destino.id}, en estado "Propuesto"; no reactiva ni traslada el estado de ${aprId}.`);
  toast("Nueva propuesta creada a partir del Aprendizaje cerrado.");

async function onCambiaFaseCurricular(procesoId){
  const faseId = document.getElementById("cs-fase").value;
  const selGrado = document.getElementById("cs-grado");
  if(!faseId){ selGrado.disabled = true; selGrado.innerHTML = `<option value="">Elige primero una Fase</option>`; return; }
  try{
    const grados = await getGrados();
    const delaFase = grados.filter(g=>g.fase_id===faseId);
    selGrado.disabled = false;
    selGrado.innerHTML = `<option value="">Selecciona un Grado</option>` + delaFase.map(g=>`<option value="${g.id}">${g.grado}</option>`).join("");
  } catch(e){
    selGrado.disabled = true;
    selGrado.innerHTML = `<option value="">No disponible sin conexión</option>`;
  }
}
function onCambiaGradoCurricular(procesoId){
  window._currSel.gradoId = document.getElementById("cs-grado").value;
  document.getElementById("cs-contenido-wrap").style.display = "none";
  document.getElementById("cs-pda-wrap").style.display = "none";
  // Proyectos.json (226 KB) NUNCA se descarga solo por elegir un Grado — se muestra un botón
  // explícito; el fetch solo ocurre si la persona usuaria realmente pide ver los proyectos.
  const toggle = document.getElementById("cs-proyecto-toggle");
  toggle.style.display = window._currSel.gradoId ? "block" : "none";
  document.getElementById("cs-proyecto-wrap").style.display = "none";
  document.getElementById("cs-proyecto-detalle").innerHTML = "";
  onCambiaCamposCurricular(procesoId);
}
async function mostrarProyectosDelGrado(procesoId){
  document.getElementById("cs-proyecto-toggle").style.display = "none";
  await cargarProyectosDelGrado(procesoId);
}
async function onCambiaCamposCurricular(procesoId){
  // Recolecta todos los checkboxes de campos formativos marcados (no los de ejes).
  const checks = Array.from(document.querySelectorAll('#curricular-body input[type=checkbox][data-nombre]')).filter(c=>!c.classList.contains("cs-eje"));
  const seleccionados = checks.filter(c=>c.checked);
  window._currSel.campoIds = seleccionados.map(c=>c.value);
  window._currSel.campoTextos = seleccionados.map(c=>c.dataset.nombre);
  const wrap = document.getElementById("cs-contenido-wrap");
  const gradoId = window._currSel.gradoId;
  if(!gradoId || seleccionados.length===0){ wrap.style.display="none"; document.getElementById("cs-pda-wrap").style.display="none"; return; }
  const campoIdParaContenido = seleccionados[0].value;
  window._currSel.campoIdPrincipal = campoIdParaContenido;
  const sel = document.getElementById("cs-contenido");
  wrap.style.display = "block";
  try{
    const contenidos = await getContenidos(gradoId, campoIdParaContenido);
    sel.innerHTML = contenidos.length
      ? `<option value="">Selecciona un Contenido</option>` + contenidos.map(c=>`<option value="${c.id}">${c.texto}</option>`).join("")
      : `<option value="">No hay Contenidos para este Grado y Campo en el catálogo</option>`;
  } catch(e){
    sel.innerHTML = `<option value="">No disponible sin conexión</option>`;
  }
  document.getElementById("cs-pda-wrap").style.display = "none";
}
async function onCambiaContenidoCurricular(procesoId){
  const contenidoId = document.getElementById("cs-contenido").value;
  window._currSel.contenidoId = contenidoId;
  const wrapPda = document.getElementById("cs-pda-wrap");
  if(!contenidoId){ wrapPda.style.display="none"; return; }
  wrapPda.style.display = "block";
  document.getElementById("cs-pdas").innerHTML = `<p class="small muted">Cargando PDA…</p>`;
  try{
    const pdas = await getPdas(window._currSel.gradoId, window._currSel.campoIdPrincipal, contenidoId);
    document.getElementById("cs-pdas").innerHTML = pdas.length
      ? pdas.map(pd=>`<label class="small" style="display:block; margin-bottom:6px;"><input type="checkbox" value="${pd.registro_id}" data-texto="${escapeHtml(pd.pda)}" class="cs-pda"> ${pd.pda}</label>`).join("")
      : `<p class="small muted">Este Contenido no tiene PDA asociados en el catálogo (puede ser una incidencia documentada de la fuente).</p>`;
  } catch(e){
    // Fallo aislado a esta pieza específica (p. ej. contenido-pda.json o pdas.json inalcanzable):
    // nunca debe quedar en blanco en silencio, ni propagar una excepción hacia el resto de la app.
    document.getElementById("cs-pdas").innerHTML = `<p class="small" style="color:var(--rojo);">No se pudieron cargar los PDA de este Contenido (catálogo no disponible en este momento). El resto del Proceso no se ve afectado.</p>`;
  }
}
function onCambiaEjesCurricular(){
  const marcados = Array.from(document.querySelectorAll('#curricular-body .cs-eje:checked'));
  window._currSel.ejeIds = marcados.map(c=>c.value);
  window._currSel.ejeTextos = marcados.map(c=>c.dataset.nombre);

async function cargarProyectosDelGrado(procesoId){
  const wrap = document.getElementById("cs-proyecto-wrap");
  const gradoId = window._currSel.gradoId;
  if(!gradoId){ wrap.style.display="none"; return; }
  wrap.style.display = "block";

  sel.innerHTML = `<option value="">Cargando…</option>`;
  try{
    const proyectos = await getProyectos(gradoId);
    sel.innerHTML = `<option value="">Ninguno</option>` + proyectos.map(pr=>`<option value="${pr.proyecto_id}">${pr.titulo}</option>`).join("");

  }
}
async function onCambiaProyectoCurricular(){
  const proyectoId = document.getElementById("cs-proyecto").value;
  window._currSel.proyectoId = proyectoId;
  const detalle = document.getElementById("cs-proyecto-detalle");
  if(!proyectoId){ detalle.innerHTML=""; window._currSel.proyectoTitulo=null; return; }
  const sel = document.getElementById("cs-proyecto");
  window._currSel.proyectoTitulo = sel.options[sel.selectedIndex].textContent;
  detalle.innerHTML = `<p class="small muted">Cargando detalle del proyecto…</p>`;
  try{
    const [ejesP, propositos, incidencias] = await Promise.all([
      getProyectoEjes(proyectoId), getProyectoProposito(proyectoId), getDiscrepanciasYIncidencias()
    ]);
    const incidenciaDeEste = incidencias.incidenciasProyectos.filter(i=>i.proyecto_id===proyectoId);
    detalle.innerHTML = `
      <div class="card dim">
        <p class="small"><b>Ejes del proyecto (catálogo):</b> ${ejesP.map(e=>e.nombre).join(", ")||"—"}</p>
        ${propositos.map(pp=>`<p class="small"><b>Propósito (catálogo):</b> ${pp.proposito}</p>`).join("")}
        ${incidenciaDeEste.length ? `<div class="banner banner-warn small">Este proyecto tiene una incidencia documentada en la fuente (${incidenciaDeEste[0].estado}) — se muestra tal como está registrada, sin corregirla.</div>` : ""}
    </div>
  `;
  } catch(e){
    detalle.innerHTML = `<p class="small" style="color:var(--rojo);">No se pudo cargar el detalle de este proyecto (catálogo no disponible en este momento).</p>`;
  }
}
function guardarReferenteCurricular(procesoId){
  const s = window._currSel || {};
  if(!s.gradoId || !(s.campoIds&&s.campoIds.length)){
    toast("Selecciona al menos Grado y un Campo formativo para guardar el Referente curricular.");
    return;
  }
  const p = DATA.procesos.find(x=>x.id===procesoId);
  const gradoSel = document.getElementById("cs-grado");
  const gradoTexto = gradoSel.options[gradoSel.selectedIndex]?.textContent || s.gradoId;
  const contenidoSel = document.getElementById("cs-contenido");
  const contenidoTexto = (s.contenidoId && contenidoSel) ? contenidoSel.options[contenidoSel.selectedIndex].textContent : null;
  const pdaTextos = Array.from(document.querySelectorAll('#curricular-body .cs-pda:checked')).map(c=>c.dataset.texto);
  p.referenteCurricular = {
    faseId: document.getElementById("cs-fase").value,
    gradoId: s.gradoId, gradoTexto,
    campoIds: s.campoIds, campoTextos: s.campoTextos||[],
    contenidoId: s.contenidoId||null, contenidoTexto,
    pdaIds: Array.from(document.querySelectorAll('#curricular-body .cs-pda:checked')).map(c=>c.value),
    pdaTextos,
    ejeIds: s.ejeIds||[], ejeTextos: s.ejeTextos||[],
    proyectoId: s.proyectoId||null, proyectoTitulo: s.proyectoTitulo||null,
    version: getCurriculumEstadoConexion().versionActiva,
  };
  pushTrace(`Referente curricular guardado en Proceso ${procesoId} (catálogo v${p.referenteCurricular.version}).`, "modificacion");
  toast("Referente curricular guardado.");
  cargarPanelCurricular(procesoId);
}
function quitarReferenteCurricular(procesoId){
  const p = DATA.procesos.find(x=>x.id===procesoId);
  p.referenteCurricular = null;
  pushTrace(`Referente curricular retirado del Proceso ${procesoId}.`, "modificacion");
  toast("Referente curricular retirado.");
  cargarPanelCurricular(procesoId);
}

function revocarConexion(id){
  // El permiso se comprueba AQUÍ, al ejecutar la acción — no solo al decidir si se muestra el botón.
  // Esto bloquea también cualquier intento por una ruta alternativa (p. ej. llamar a esta función
  // directamente), no únicamente el clic normal desde una tarjeta ya filtrada.
  const c = DATA.conexiones.find(x=>x.id===id);
  if(!actorPuedeVerConexion(STATE.actor, c)){
    pushTrace(`Intento de acción denegado: ${actorInfo(STATE.actor).nombre} intentó revocar la Conexión ${id} sin una Autorización vigente sobre su Proceso.`, "acceso");
    toast("No tienes permiso para modificar esta Conexión.");
    return;
  }
  confirmModal({
    title:"Revocar esta Conexión",
    body:"El acceso futuro se cierra. No podemos garantizar que se elimine una copia que la otra parte ya haya visto o guardado.",
    warn:"Esto cierra el acceso futuro, no borra copias ya salidas de la aplicación.",
    danger:true, confirmLabel:"Revocar Conexión",
    onConfirm:()=>{
      const c = DATA.conexiones.find(x=>x.id===id); if(c) c.estado="Revocada";
      pushTrace(`Conexión ${id} revocada.`);
      toast("Conexión revocada.");
      render();
    }
  });
}

function abrirCompartir(tipo, refId){
  let resumen = "";
  if(tipo==="Observación"){ for(const k in DATA.observaciones){ const f=DATA.observaciones[k].find(o=>o.id===refId); if(f){ resumen=f.descripcion; break; } } }
  else if(tipo==="Aprendizaje"){ const [a]=findAprendizaje(refId); if(a) resumen=a.descripcion; }
  resumen = resumen.slice(0,80) + (resumen.length>80?"…":"");
  const conexionesActivas = DATA.conexiones.filter(c=>c.estado==="Activa");
  openModal(`
    <h2>Compartir ${tipo}</h2>
    ${notaTernura("Antes de compartir, piensa en quién lo va a leer y para qué lo necesita.")}
    <p class="small muted">${escapeHtml(resumen)}</p>
    <div class="field">
      <label>Conexión destinataria <span class="req">*</span></label>
      <select id="in-compartir-con">
        ${conexionesActivas.length ? conexionesActivas.map(c=>`<option value="${c.id}">${c.familiaLabel} ↔ ${c.escuelaLabel}</option>`).join("") : `<option value="">No tienes una Conexión activa</option>`}
      </select>
    </div>
    <div class="warn-box">Quien reciba esto no podrá reenviarlo a otra persona sin una nueva autorización propia.</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" ${conexionesActivas.length?"":"disabled"} onclick="confirmarCompartir('${tipo}','${refId}')">Confirmar compartición</button>
    </div>
  `);
}
function confirmarCompartir(tipo, refId){
  pushTrace(`${tipo} ${refId} compartido vía el Puente. La compartición no habilita a la otra parte a reenviarlo.`, "comparticion");
  closeModal();
  toast(`${tipo} compartido.`);
}

function vigenciaInfo(a){
  const vence = addDays(a.inicio, a.vigenciaDias);
  const restantes = daysBetween(todayISO(), vence);
  let cls = "ok", label = `Vence en ${restantes} días (${fmt(vence)})`;
  if(a.estado==="revocada"){ cls="vencida"; label = `Revocada el ${fmt(a.revocadaEl)}`; }
  else if(a.estado==="vigencia_perdida"){ cls="vencida"; label = `Vigencia perdida — ${a.motivoPerdida} (${fmt(a.fechaPerdida)})`; }
  else if(restantes<=0){ cls="vencida"; label = `Vencida el ${fmt(vence)}`; }
  else if(restantes<=15){ cls="pronto"; label = `Vence en ${restantes} días (${fmt(vence)})`; }
  const total = a.vigenciaDias;
  const transcurridos = Math.min(total, daysBetween(a.inicio, todayISO()));
  const pct = (a.estado==="revocada"||a.estado==="vigencia_perdida") ? 100 : Math.min(100, Math.round((transcurridos/total)*100));
  return {cls, label, pct, vence};
}
function screenAutorizaciones(){
  const actor = actorInfo(STATE.actor);
  const esFamilia = actor.id==="fam";
  const otorgadas = esFamilia ? DATA.autorizaciones : DATA.autorizaciones.filter(a=>a.receptor.includes(actor.correo));
  return `
    <h1>Autorizaciones</h1>
    ${esFamilia ? `
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-primary" onclick="abrirOtorgarAutorizacion()">Otorgar Autorización</button>
      <button class="btn btn-secondary" onclick="abrirSolicitarConsolidacion()">Solicitar Autorización de consolidación</button>
    </div>` : `<p class="small muted" style="margin-bottom:14px;">Como ${actor.rolLabel.toLowerCase()}, ves únicamente las Autorizaciones que has recibido — nunca las de otros usuarios.</p>`}
    ${otorgadas.length===0 ? `<div class="empty-state">No tienes ninguna Autorización registrada todavía.</div>` : ""}
    ${otorgadas.map(a=>{
      const v = vigenciaInfo(a);
      const activa = a.estado==="vigente" && v.cls!=="vencida";
      return `
      <div class="card">
        <p class="small" style="margin:0 0 8px; font-style:italic; color:var(--ternura);">Vigente porque: "${a.finalidad}"</p>
        <div class="dl">
          <dt>Otorgante</dt><dd>${a.otorgante}</dd>
          <dt>Receptor</dt><dd>${a.receptor}</dd>
          <dt>Objeto</dt><dd>${a.objeto}</dd>
        </div>
        <div class="vigencia ${v.cls}">
          <div class="bar"><div class="bar-fill" style="width:${v.pct}%"></div></div>
          <div class="vigencia-text">${v.label}</div>
        </div>
        <div class="btn-row">
          ${esFamilia && activa ? `<button class="btn btn-secondary btn-sm" onclick="renovarAutorizacion('${a.id}')">Renovar</button>
                                       <button class="btn btn-danger btn-sm" onclick="revocarAutorizacion('${a.id}')">Revocar</button>` : ""}
          ${!activa && a.estado==="revocada" ? `<span class="small muted">Revocada por ${a.revocadaPor}</span>` : ""}
          ${!activa && a.estado==="vigencia_perdida" ? `<span class="small muted">${a.motivoPerdida}</span>` : ""}
        </div>
      </div>`;
    }).join("")}
  `;

// ============================================================
// modo: "todas" (cualquier persona del directorio, para Autorización ordinaria)
//       "facultada" (solo institucionales y previamente facultadas, para Autorización de consolidación)
window._personSelState = {};
function personSelectorHtml(fieldId, modo){
  window._personSelState[fieldId] = window._personSelState[fieldId] || {seleccion:null, filtro:""};
  return `
    <div class="field">
      <label>Receptor específico <span class="req">*</span></label>
      <input type="text" placeholder="Buscar por nombre o correo…" oninput="filtrarPersonas('${fieldId}','${modo}', this.value)">
      <div class="help">Solo personas verificadas — nunca un rol o cargo genérico ("docente", "director", "escuela"). Dominios reconocidos: @aefcm.gob.mx y @docente.aefcm.gob.mx.</div>
      <div id="${fieldId}-list" style="margin-top:8px; max-height:200px; overflow:auto;"></div>
      <div id="${fieldId}-selected" class="small" style="margin-top:6px; font-weight:600;"></div>
    </div>
  `;
}
function personasFiltradas(modo, filtro){
  let lista = PERSONAS_VERIFICADAS;
  if(modo==="facultada") lista = lista.filter(p=>p.institucional && p.facultada);
  if(filtro){
    const f = filtro.toLowerCase();
    lista = lista.filter(p=>p.nombre.toLowerCase().includes(f) || p.correo.toLowerCase().includes(f));
  }
  return lista;
}
function filtrarPersonas(fieldId, modo, filtro){
  window._personSelState[fieldId].filtro = filtro;
  renderPersonList(fieldId, modo);
}
function renderPersonList(fieldId, modo){
  const lista = personasFiltradas(modo, window._personSelState[fieldId].filtro);
  const el = document.getElementById(fieldId+"-list");
  if(!el) return;
  el.innerHTML = lista.map(p=>`
    <div class="card clickable" style="padding:8px 10px; margin-bottom:6px;" onclick="seleccionarPersona('${fieldId}','${p.id}')">
      <div style="display:flex; justify-content:space-between; gap:8px;">
        <b class="small">${p.nombre}</b>
        <span class="small" style="color:var(--verde); font-weight:600;">✓ Identidad verificada — entorno demostrativo</span>
      </div>
      <div class="small muted">${p.correo} · ${p.institucion}</div>
      <div class="small muted">${p.contexto}</div>
      ${modo==="facultada" && !p.facultada ? `<div class="small" style="color:var(--rojo);">No facultada para Autorización de consolidación</div>` : ""}
    </div>
  `).join("") || `<p class="small muted">Ninguna persona verificada coincide con la búsqueda.</p>`;
}
function seleccionarPersona(fieldId, personaId){
  const p = PERSONAS_VERIFICADAS.find(x=>x.id===personaId);
  window._personSelState[fieldId].seleccion = p;
  document.getElementById(fieldId+"-selected").innerHTML = `Seleccionado: ${p.nombre} (${p.correo})`;
}
function personaSeleccionada(fieldId){
  return window._personSelState[fieldId] ? window._personSelState[fieldId].seleccion : null;
}

function guardarAutorizacion(){

  const objeto = document.getElementById("in-aut-objeto").value;
  const id = "A" + (DATA.autorizaciones.length+1);
  DATA.autorizaciones.unshift({id, tipo:"ordinaria", otorgante:"Familia (ficticia)", receptor:`${persona.nombre} (${persona.correo})`, objeto:"Proceso "+objeto, finalidad:fin, inicio:todayISO(), vigenciaDias:90, estado:"vigente"});
  pushTrace(`Autorización ${id} otorgada a ${persona.nombre} (persona verificada); vigente por 3 meses. Registro de trazabilidad de 10 campos creado.`, "autorizacion");
  closeModal(); toast("Autorización otorgada.");
  render();
}

  const a = DATA.autorizaciones.find(x=>x.id===id);

  pushTrace(`Autorización ${id} renovada mediante acción humana explícita.`);
  toast("Autorización renovada.");
  render();
}

  confirmModal({
    title:"Revocar esta Autorización",

  const rel = DATA_RELACIONES.find(r=>r.vigente);

  rel.vigente = false; rel.fin = todayISO();
  DATA_RELACIONES.push({id:"R"+(DATA_RELACIONES.length+1), procesoId:rel.procesoId, docenteId:nuevoId, vigente:true, inicio:todayISO(), escuela:rel.escuela});

  const salienteCorreo = actorInfo(salienteId).correo;
  DATA.autorizaciones.forEach(a=>{

      a.estado="vigencia_perdida"; a.motivoPerdida="Cambio de docente"; a.fechaPerdida=todayISO();

  pushTrace(`Cambio de docente registrado en Proceso ${rel.procesoId}: ${actorInfo(salienteId).nombre} → ${actorInfo(nuevoId).nombre}. Ninguna Autorización se transfirió automáticamente.`, "autorizacion");

function screenBusqueda(){
  const actor = actorInfo(STATE.actor);
  const accesibles = DATA.procesos.filter(p=> actor.id==="fam" ? true : autorizacionVigentePara(actor.id, "Proceso "+p.id));
  const pid = STATE.params.pid || (accesibles[0] && accesibles[0].id);
  return `
    <h1>Búsqueda Contextual</h1>
    ${accesibles.length===0 ? `<div class="empty-state">No tienes ningún contexto autorizado para buscar todavía.</div>` : `
    <div class="field">
      <label>Contexto (Proceso autorizado)</label>
      <select onchange="goTo('busqueda',{pid:this.value})">
        ${accesibles.map(p=>`<option value="${p.id}" ${p.id===pid?"selected":""}>${p.situacion.slice(0,50)}…</option>`).join("")}
      </select>
    </div>
    <div class="banner banner-info">Buscando dentro de este contexto: <b>${(DATA.procesos.find(p=>p.id===pid)||{}).situacion||""}</b>. No es posible buscar fuera de los Procesos donde tienes permiso, ni por nombre de Persona acompañada.</div>
    <div class="field"><input type="text" id="in-busqueda-texto" placeholder="Buscar dentro de este Proceso…" oninput="actualizarBusqueda('${pid}')"></div>
    <div id="busqueda-resultados"></div>
    `}
  `;
}
function actualizarBusqueda(pid){
  const q = document.getElementById("in-busqueda-texto").value.toLowerCase();
  const cont = document.getElementById("busqueda-resultados");
  if(!q){ cont.innerHTML = ""; return; }
  const obs = (DATA.observaciones[pid]||[]).filter(o=>o.descripcion.toLowerCase().includes(q));
  const ests = (DATA.estrategias[pid]||[]).filter(e=>e.descripcion.toLowerCase().includes(q));
  const aprs = (DATA.aprendizajes[pid]||[]).filter(a=>a.descripcion.toLowerCase().includes(q));
  const resultados = [
    ...obs.map(o=>({tipo:"Observación", texto:o.descripcion})),
    ...ests.map(e=>({tipo:"Estrategia", texto:e.descripcion})),
    ...aprs.map(a=>({tipo:"Aprendizaje", texto:a.descripcion})),
  ];
  cont.innerHTML = resultados.length
    ? resultados.map(r=>`<div class="card"><span class="chip chip-activo">${r.tipo}</span><p style="margin-top:6px;">${r.texto}</p></div>`).join("")
    : `<p class="small muted">Sin resultados dentro de este contexto.</p>`;
}

// ============================================================
// CURRICULUMSERVICE (Fase 8.3) — Adecuación curricular NEM 2022
// ============================================================
// Aislamiento estricto: este módulo NUNCA lee ni escribe DATA, STATE, ACTORES,
// PERSONAS_VERIFICADAS, ni ninguna estructura de personas/procesos/autorizaciones.
// Su única superficie de contacto con el resto de la aplicación son las funciones
// get*() expuestas al final de este bloque, que devuelven datos curriculares puros
// (ids y textos del catálogo), nunca nada de una Persona acompañada. La escritura
// del "Referente curricular" en una Situación/Observación ocurre en el código de
// esas pantallas, tomando los ids devueltos aquí — nunca al revés.
//
// Fuente curricular OPERATIVA (no normativa SEP): curriculo-primaria-nem v1.0,
// generado a partir de "Generador de Planeaciones Primaria.xlsx". Ver CURRICULUM_FUENTE.

const CURRICULUM_BASE_URL = "https://raw.githubusercontent.com/lalitoelprofefulanito-dot/curriculo-primaria-nem/main/";
const CURRICULUM_FUENTE = {
  catalogo: "curriculo-primaria-nem",
  fuenteOperativa: "Generador de Planeaciones Primaria.xlsx",
  esNormativoSEP: false, // ver Fase 8.3, sección 29 del encargo: fuente operativa ≠ fuente normativa
};
// Archivos del catálogo remoto (nombres lógicos → nombre de archivo real en el repositorio).
const CURRICULUM_ARCHIVOS = {
  version: "version.json",
  manifest: "manifest.json",
  fases: "fases.json",
  grados: "grados.json",
  camposFormativos: "campos-formativos.json",
  ejesArticuladores: "ejes-articuladores.json",
  contenidos: "contenidos.json",
  pdas: "pdas.json",
  proyectos: "proyectos.json",
  gradoCampoContenido: "grado-campo-contenido.json",
  contenidoPda: "contenido-pda.json",
  proyectoEje: "proyecto-eje.json",
  proyectoCampo: "proyecto-campo.json",
  proyectoContenido: "proyecto-contenido.json",
  proyectoProposito: "proyecto-proposito.json",
  proyectoPda: "proyecto-pda.json",
  discrepanciasCampos: "discrepancias-campos.json",
  discrepanciasEjes: "discrepancias-ejes.json",
  incidenciasContenidos: "incidencias-contenidos.json",
  incidenciasProyectos: "incidencias-proyectos.json",
};
// Catálogos pequeños necesarios para poblar la interfaz curricular inicial (carga bajo demanda,
// Fase 8.3 sección 8): se cargan juntos la primera vez que se visita la sección curricular,
// nunca al abrir Conociéndonos en general.
const CURRICULUM_ARCHIVOS_INICIALES = ["version","fases","grados","camposFormativos","ejesArticuladores"];

// ---------- estado interno del servicio (aislado de STATE de la aplicación) ----------
const _curriculumMem = {}; // caché en memoria de la sesión: { nombreArchivo: {version, data} }
let _curriculumVersionActiva = null;   // versión confirmada y en uso esta sesión
let _curriculumVersionRevisada = false; // evita revisar version.json más de una vez por visita a la sección
let _curriculumActualizacionPendiente = null; // {versionNueva, motivo} si una migración de versión falló

// ---------- IndexedDB: única persistencia entre sesiones, exclusiva de datos curriculares ----------
const CURRICULUM_DB_NAME = "conociendonos-curriculo-cache";
const CURRICULUM_STORE = "archivos";
function _curriculumAbrirDB(){
  return new Promise((resolve, reject)=>{
    if(!("indexedDB" in window)){ reject(new Error("IndexedDB no disponible")); return; }
    const req = indexedDB.open(CURRICULUM_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(CURRICULUM_STORE, {keyPath:"archivo"}); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function _curriculumDbGet(archivo){
  try{
    const db = await _curriculumAbrirDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(CURRICULUM_STORE, "readonly");
      const req = tx.objectStore(CURRICULUM_STORE).get(archivo);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>reject(req.error);
    });
  } catch(e){ return null; } // IndexedDB no disponible: se degrada a caché en memoria únicamente
}
async function _curriculumDbSet(archivo, version, data){
  try{
    const db = await _curriculumAbrirDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(CURRICULUM_STORE, "readwrite");
      tx.objectStore(CURRICULUM_STORE).put({archivo, version, data, fecha: new Date().toISOString()});
      tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
    });
  } catch(e){ /* degradación silenciosa a memoria; no es un error que deba interrumpir a la persona usuaria */ }
}
async function _curriculumDbBorrarVersion(versionAEliminar){
  // Purga NO destructiva prematura: solo se llama después de confirmar que la nueva versión
  // cargó correctamente (ver _curriculumRevisarVersion). Nunca se invoca si la migración falló.
  try{
    const db = await _curriculumAbrirDB();
    const tx = db.transaction(CURRICULUM_STORE, "readwrite");
    const store = tx.objectStore(CURRICULUM_STORE);
    const req = store.getAll();
    req.onsuccess = ()=>{
      (req.result||[]).forEach(entry=>{ if(entry.version===versionAEliminar) store.delete(entry.archivo); });
    };
    await new Promise((resolve)=>{ tx.oncomplete = resolve; tx.onerror = resolve; });
  } catch(e){ /* no crítico */ }
}

// ---------- comprobación de versión (sección "Versionado y caché" — precisiones aprobadas) ----------
// Regla: una sesión no mezcla datos de versiones distintas. Toda entrada de caché está etiquetada
// con la versión con la que se descargó. No se borra la versión anterior hasta que la nueva haya
// podido cargarse correctamente (validada con los catálogos pequeños). Si la validación falla,
// se conserva la versión previa como activa y se registra una actualización pendiente.
// Nota de concurrencia importante: cargarPanelCurricular() pide varios catálogos EN PARALELO
// (Promise.all), y cada uno internamente necesita conocer la versión activa. Sin protección,
// varias llamadas concurrentes podrían ejecutar la revisión de versión a la vez y obtener un
// valor incompleto a mitad de camino — exactamente el riesgo de "mezclar registros entre
// versiones" que se pidió evitar. _curriculumRevisionPromise garantiza que, si una revisión ya
// está en curso, cualquier llamada concurrente espera el MISMO resultado final, en vez de
// disparar una revisión propia o leer un valor todavía no resuelto.
let _curriculumRevisionPromise = null;
async function _curriculumRevisarVersion(){
  if(_curriculumVersionRevisada) return _curriculumVersionActiva;
  if(_curriculumRevisionPromise) return _curriculumRevisionPromise;
  _curriculumRevisionPromise = _curriculumRevisarVersionInterno();
  const resultado = await _curriculumRevisionPromise;
  _curriculumRevisionPromise = null;
  return resultado;
}
async function _curriculumRevisarVersionInterno(){
  if(_curriculumVersionRevisada) return _curriculumVersionActiva;
  _curriculumVersionRevisada = true;
  let versionRemota = null;
  try{
    const r = await fetch(CURRICULUM_BASE_URL + CURRICULUM_ARCHIVOS.version, {cache:"no-store"});
    if(r.ok){ const j = await r.json(); versionRemota = j.version; }
  } catch(e){ /* sin red: se maneja abajo */ }

  const entradaVersionCacheada = await _curriculumDbGet(CURRICULUM_ARCHIVOS.version);
  const versionCacheada = entradaVersionCacheada ? entradaVersionCacheada.data.version : null;

  if(!versionRemota){
    // Sin conexión (o version.json inalcanzable): usar la última versión válida conocida, si existe.
    _curriculumVersionActiva = versionCacheada; // puede ser null si nunca se descargó nada
    return _curriculumVersionActiva;
  }

  if(!versionCacheada){
    // Primera vez: no hay nada que migrar, simplemente se adopta la versión remota.
    _curriculumVersionActiva = versionRemota;
    await _curriculumDbSet(CURRICULUM_ARCHIVOS.version, versionRemota, {version: versionRemota});
    return _curriculumVersionActiva;
  }

  if(versionCacheada === versionRemota){
    _curriculumVersionActiva = versionRemota;
    return _curriculumVersionActiva;
  }

  // Cambio de versión detectado: NO se invalida nada todavía. Se intenta cargar y validar
  // los catálogos pequeños bajo la nueva versión antes de mover el puntero de versión activa.
  try{
    for(const nombre of ["fases","grados","camposFormativos","ejesArticuladores"]){
      const resp = await fetch(CURRICULUM_BASE_URL + CURRICULUM_ARCHIVOS[nombre], {cache:"no-store"});
      if(!resp.ok) throw new Error("No se pudo validar "+nombre+" en la versión nueva");
      const data = await resp.json();
      await _curriculumDbSet(CURRICULUM_ARCHIVOS[nombre], versionRemota, data);
      _curriculumMem[CURRICULUM_ARCHIVOS[nombre]] = {version: versionRemota, data};
    }
    // Validación exitosa: ahora sí se activa la nueva versión y se purga la anterior (no antes).
    await _curriculumDbSet(CURRICULUM_ARCHIVOS.version, versionRemota, {version: versionRemota});
    await _curriculumDbBorrarVersion(versionCacheada);
    _curriculumVersionActiva = versionRemota;
    pushTrace(`Catálogo curricular actualizado de la versión ${versionCacheada} a ${versionRemota}.`);
  } catch(e){
    // La migración falló: se conserva la versión anterior como activa (nunca se mezclan versiones)
    // y se deja constancia de que existe una actualización pendiente, sin romper nada.
    _curriculumVersionActiva = versionCacheada;
    _curriculumActualizacionPendiente = {versionNueva: versionRemota, motivo: e.message};
  }
  return _curriculumVersionActiva;
}

// ---------- carga genérica de un archivo del catálogo, con caché por versión ----------
async function _curriculumCargar(nombreLogico){
  const archivo = CURRICULUM_ARCHIVOS[nombreLogico];
  const version = await _curriculumRevisarVersion();

  // 1. Caché en memoria de la sesión (más rápida, evita incluso tocar IndexedDB en la misma visita)
  if(_curriculumMem[archivo] && (version===null || _curriculumMem[archivo].version===version)){
    return {data:_curriculumMem[archivo].data, estado:"cache-memoria", version:_curriculumMem[archivo].version};
  }

  // 2. Caché persistente (IndexedDB), solo si coincide con la versión activa de esta sesión
  const entrada = await _curriculumDbGet(archivo);
  if(entrada && (version===null || entrada.version===version)){
    _curriculumMem[archivo] = {version:entrada.version, data:entrada.data};
    return {data:entrada.data, estado:"cache-indexeddb", version:entrada.version};
  }

  // 3. Red — carga bajo demanda, solo cuando de verdad se necesita este archivo específico
  try{
    const resp = await fetch(CURRICULUM_BASE_URL + archivo);
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const data = await resp.json();
    const versionParaGuardar = version || (await _curriculumDbGet(CURRICULUM_ARCHIVOS.version))?.data?.version || "desconocida";
    _curriculumMem[archivo] = {version:versionParaGuardar, data};
    await _curriculumDbSet(archivo, versionParaGuardar, data);
    return {data, estado:"red", version:versionParaGuardar};
  } catch(e){
    // 4. Sin red y sin caché válida para este archivo: si existe CUALQUIER copia previa (aunque
    // sea de una versión distinta), se usa como último recurso, marcada explícitamente como tal —
    // preferible a dejar la pantalla vacía, y nunca se presenta como si fuera la versión vigente.
    if(entrada){
      return {data:entrada.data, estado:"cache-obsoleta-sin-conexion", version:entrada.version};
    }
    throw new Error("catalogo-no-disponible");
  }
}

// ---------- API pública del servicio (nombres conceptuales del encargo, sección 7) ----------
async function getFases(){ const r = await _curriculumCargar("fases"); return r.data; }
async function getGrados(){ const r = await _curriculumCargar("grados"); return r.data; }
async function getCamposFormativos(){ const r = await _curriculumCargar("camposFormativos"); return r.data; }
async function getEjesArticuladores(){ const r = await _curriculumCargar("ejesArticuladores"); return r.data; }

async function getContenidos(gradoId, campoFormativoId){
  const rel = (await _curriculumCargar("gradoCampoContenido")).data;
  const cont = (await _curriculumCargar("contenidos")).data;
  const idsRelevantes = rel.filter(r=>r.grado_id===gradoId && r.campo_formativo_id===campoFormativoId).map(r=>r.contenido_id);
  return cont.filter(c=>idsRelevantes.includes(c.id));
}
async function getPdas(gradoId, campoFormativoId, contenidoId){
  // Nota de diseño (documentada en el Diseño Técnico): un mismo texto de Contenido puede repetirse
  // en distintos Grado+Campo con PDA distintos — por eso esta función exige los tres identificadores,
  // no solo contenidoId, para no mezclar PDA de un grado con los de otro.
  const rel = (await _curriculumCargar("contenidoPda")).data;
  const pdasTodos = (await _curriculumCargar("pdas")).data;
  const idsRelevantes = rel.filter(r=>r.grado_id===gradoId && r.campo_formativo_id===campoFormativoId && r.contenido_id===contenidoId).map(r=>r.pda_id);
  return pdasTodos.filter(p=>idsRelevantes.includes(p.registro_id));
}
async function getProyectos(gradoId){
  const proy = (await _curriculumCargar("proyectos")).data;
  return gradoId ? proy.filter(p=>p.grado_id===gradoId) : proy;
}
async function getProyectoEjes(proyectoId){
  const rel = (await _curriculumCargar("proyectoEje")).data;
  const ejes = (await _curriculumCargar("ejesArticuladores")).data;
  const ids = rel.filter(r=>r.proyecto_id===proyectoId).map(r=>r.eje_id);
  return ejes.filter(e=>ids.includes(e.id));
}
async function getProyectoCampos(proyectoId){
  const rel = (await _curriculumCargar("proyectoCampo")).data;
  return rel.filter(r=>r.proyecto_id===proyectoId);
}
async function getProyectoContenidos(proyectoId){
  const rel = (await _curriculumCargar("proyectoContenido")).data;
  return rel.filter(r=>r.proyecto_id===proyectoId);
}
async function getProyectoProposito(proyectoId){
  const rel = (await _curriculumCargar("proyectoProposito")).data;
  return rel.filter(r=>r.proyecto_id===proyectoId);
}
async function getProyectoPdas(proyectoId){
  const rel = (await _curriculumCargar("proyectoPda")).data;
  return rel.filter(r=>r.proyecto_id===proyectoId);
}
async function getDiscrepanciasYIncidencias(){
  // Expone las auditorías ya existentes en la fuente (Fase 8.3, sección 28): nunca se corrigen
  // ni se ocultan silenciosamente, se conservan y se muestran como lo que son.
  const [dc, de, ic, ip] = await Promise.all([
    _curriculumCargar("discrepanciasCampos"), _curriculumCargar("discrepanciasEjes"),
    _curriculumCargar("incidenciasContenidos"), _curriculumCargar("incidenciasProyectos"),
  ]);
  return {discrepanciasCampos:dc.data, discrepanciasEjes:de.data, incidenciasContenidos:ic.data, incidenciasProyectos:ip.data};
}
function getCurriculumEstadoConexion(){
  return {
    versionActiva: _curriculumVersionActiva,
    actualizacionPendiente: _curriculumActualizacionPendiente,
    fuente: CURRICULUM_FUENTE,
  };
}

render();

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(e => console.warn("Service Worker no se pudo registrar:", e));
  });
}
